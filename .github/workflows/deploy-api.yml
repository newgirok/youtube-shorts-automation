name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/api/src/**
      - apps/api/serverless.yml
      - apps/api/package.json
      - packages/shared/src/**
      - packages/shared/prisma/**

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::682251233572:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @shorts/shared prisma:generate && pnpm --filter @shorts/shared build

      - name: Copy Prisma binary
        run: |
          PRISMA_BIN=$(find node_modules/.pnpm -name "libquery_engine-rhel-openssl-3.0.x.so.node" | head -1)
          cp "$PRISMA_BIN" apps/api/

      - name: Deploy API
        run: |
          cd apps/api
          npx serverless@3 deploy --stage prod

      - name: Slack 배포 결과 알림
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/$REPO/commit/$SHA"
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          AUTHOR="${AUTHOR_NAME} <${AUTHOR_EMAIL}>"
          TIME=$(TZ=Asia/Seoul date "+%Y-%m-%d %H:%M:%S")

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TRIGGER="workflow_dispatch"
          else
            TRIGGER="push → $REF"
          fi

          if [ "$STATUS" = "success" ]; then
            COLOR="#2eb886"; ICON="✅"
          else
            COLOR="#e01e5a"; ICON="❌"
          fi

          PAYLOAD=$(jq -n \
            --arg color   "$COLOR" \
            --arg title   "${ICON} *[PRD] ${REPO} • Deploy API*" \
            --arg time    "$TIME" \
            --arg trigger "$TRIGGER" \
            --arg msg     "${FIRST_LINE:-커밋 메시지 없음}" \
            --arg meta    "브랜치: ${REF}  ·  커밋: ${SHORT_SHA}  ·  작성자: ${AUTHOR}" \
            --arg run     "$RUN_URL" \
            --arg commit  "$COMMIT_URL" \
            '{attachments:[{color:$color,blocks:[
              {type:"section",text:{type:"mrkdwn",text:$title}},
              {type:"section",text:{type:"mrkdwn",text:("🚀  *Platform*    AWS Lambda\n📦  *App*    API\n⏰  *Time*    "+$time+"\n🔧  *Trigger*    "+$trigger)}},
              {type:"divider"},
              {type:"section",text:{type:"mrkdwn",text:$msg}},
              {type:"context",elements:[{type:"mrkdwn",text:$meta}]},
              {type:"actions",elements:[
                {type:"button",text:{type:"plain_text",text:"배포 로그"},url:$run},
                {type:"button",text:{type:"plain_text",text:"커밋"},url:$commit}
              ]}
            ]}]}')

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" -d "$PAYLOAD"
