name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/api/src/**
      - apps/api/serverless.yml
      - apps/api/package.json
      - packages/shared/src/**
      - packages/shared/prisma/**
      - .github/workflows/deploy-api.yml

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::682251233572:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @shorts/shared prisma:generate && pnpm --filter @shorts/shared build

      - name: Copy Prisma binary
        run: |
          PRISMA_BIN=$(find node_modules/.pnpm -name "libquery_engine-rhel-openssl-3.0.x.so.node" | head -1)
          cp "$PRISMA_BIN" apps/api/

      - name: Deploy API
        run: |
          cd apps/api
          npx serverless@3 deploy --stage prod

      - name: Slack 배포 결과 알림
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/$SHA"
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1 | cut -c1-60)

          if [ "$STATUS" = "success" ]; then
            COLOR="#2eb886"; ICON="✅"; LABEL="배포 완료"
          else
            COLOR="#e01e5a"; ICON="❌"; LABEL="배포 실패"
          fi

          PAYLOAD=$(jq -n \
            --arg color  "$COLOR" \
            --arg title  "$ICON *Deploy API* — $LABEL" \
            --arg branch "$REF" \
            --arg sha    "$SHORT_SHA" \
            --arg actor  "$ACTOR" \
            --arg msg    "${FIRST_LINE:-커밋 메시지 없음}" \
            --arg run    "$RUN_URL" \
            --arg commit "$COMMIT_URL" \
            '{attachments:[{color:$color,blocks:[
              {type:"section",text:{type:"mrkdwn",text:$title}},
              {type:"section",fields:[
                {type:"mrkdwn",text:("*브랜치*\n`"+$branch+"`")},
                {type:"mrkdwn",text:("*커밋*\n`"+$sha+"`")},
                {type:"mrkdwn",text:("*작성자*\n"+$actor)},
                {type:"mrkdwn",text:("*변경사항*\n"+$msg)}
              ]},
              {type:"actions",elements:[
                {type:"button",text:{type:"plain_text",text:"Actions 보기 →"},url:$run},
                {type:"button",text:{type:"plain_text",text:"커밋 보기 →"},url:$commit}
              ]}
            ]}]}')

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" -d "$PAYLOAD"
