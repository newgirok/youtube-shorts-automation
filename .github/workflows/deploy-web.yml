name: Deploy Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/web/app/**
      - apps/web/src/**
      - apps/web/components/**
      - apps/web/lib/**
      - apps/web/middleware.ts
      - apps/web/next.config.ts
      - apps/web/package.json
      - apps/web/Dockerfile
      - packages/shared/src/**
      - packages/shared/prisma/**

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 682251233572.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: web

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::682251233572:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch build secrets from SSM
        id: ssm
        run: |
          echo "NEXT_PUBLIC_API_URL=$(aws ssm get-parameter --name 'shorts.prod.NEXT_PUBLIC_API_URL' --query 'Parameter.Value' --output text)" >> $GITHUB_OUTPUT
          echo "NEXT_PUBLIC_API_SECRET=$(aws ssm get-parameter --name 'shorts.prod.NEXT_PUBLIC_API_SECRET' --with-decryption --query 'Parameter.Value' --output text)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ steps.ssm.outputs.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_API_SECRET="${{ steps.ssm.outputs.NEXT_PUBLIC_API_SECRET }}" \
            -f apps/web/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin \
                682251233572.dkr.ecr.ap-northeast-2.amazonaws.com
            cd /home/ec2-user/app
            docker compose pull
            docker compose up -d
            docker compose ps

      - name: Slack 배포 결과 알림
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/$REPO/commit/$SHA"
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          AUTHOR="${AUTHOR_NAME} <${AUTHOR_EMAIL}>"
          TIME=$(TZ=Asia/Seoul date "+%Y-%m-%d %H:%M:%S")

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TRIGGER="workflow_dispatch"
          else
            TRIGGER="push → $REF"
          fi

          if [ "$STATUS" = "success" ]; then
            COLOR="#2eb886"; ICON="✅"; LABEL="배포 완료"
          else
            COLOR="#e01e5a"; ICON="❌"; LABEL="배포 실패"
          fi

          PAYLOAD=$(jq -n \
            --arg color   "$COLOR" \
            --arg title   "${ICON} *[PRD] ${REPO} • Deploy Web — ${LABEL}*" \
            --arg server  "$REPO" \
            --arg app     "Web" \
            --arg time    "$TIME" \
            --arg trigger "$TRIGGER" \
            --arg msg     "${FIRST_LINE:-커밋 메시지 없음}" \
            --arg details "브랜치: $REF | 커밋: $SHORT_SHA | 작성자: $AUTHOR" \
            --arg run     "$RUN_URL" \
            --arg commit  "$COMMIT_URL" \
            '{attachments:[{color:$color,blocks:[
              {type:"section",text:{type:"mrkdwn",text:$title}},
              {type:"divider"},
              {type:"section",fields:[
                {type:"mrkdwn",text:("🖥️ *Server*\n`"+$server+"`")},
                {type:"mrkdwn",text:("📦 *App*\n"+$app)},
                {type:"mrkdwn",text:("⏰ *Time*\n"+$time)},
                {type:"mrkdwn",text:("🔧 *Trigger*\n"+$trigger)}
              ]},
              {type:"divider"},
              {type:"section",text:{type:"mrkdwn",text:("*Commit Message*\n```"+$msg+"```")}},
              {type:"section",text:{type:"mrkdwn",text:("*Details*\n```"+$details+"```")}},
              {type:"actions",elements:[
                {type:"button",text:{type:"plain_text",text:"Actions 보기 →"},url:$run},
                {type:"button",text:{type:"plain_text",text:"커밋 보기 →"},url:$commit}
              ]}
            ]}]}')

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" -d "$PAYLOAD"
